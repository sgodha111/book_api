[theme]
primaryColor = "#1f77b4"
backgroundColor = "#f8f9fa"
secondaryBackgroundColor = "#ffffff"
textColor = "#212529"
font = "sans serif"

[client]
showErrorDetails = true
showToolbar = true
toolbarMode = "developer"

[logger]
level = "info"

[server]
headless = true
runOnSave = true
maxUploadSize = 200

[browser]
gatherUsageStats = false

[deprecation]
showPyplotGlobalUse = false
