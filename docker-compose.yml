version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: fastapi_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    environment:
      MONGO_INITDB_DATABASE: fastapi_db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fastapi_network

  api:
    build: .
    container_name: fastapi_app
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGODB_URL: mongodb://mongo:27017
      DATABASE_NAME: fastapi_db
      ENVIRONMENT: production
      LOG_LEVEL: INFO
    volumes:
      - .:/app
    networks:
      - fastapi_network
    healthcheck:
      test: curl -f http://localhost:8000/health || exit 1
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: streamlit_app
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:8000
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_SERVER_PORT: "8501"
      STREAMLIT_SERVER_ADDRESS: "0.0.0.0"
    volumes:
      - ./streamlit_app.py:/app/streamlit_app.py
      - ./config.py:/app/config.py
      - ./.streamlit/config.toml:/app/.streamlit/config.toml
    networks:
      - fastapi_network
    healthcheck:
      test: curl -f http://localhost:8501/_stcore/health || exit 1
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  mongo_data:
  mongo_config:

networks:
  fastapi_network:
    driver: bridge
